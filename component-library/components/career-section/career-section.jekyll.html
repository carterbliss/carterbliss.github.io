<!-- begin career-section -->
{% assign c = "c-career" %}
<section class="{{c}} animate" id="career">
  <div class="container">

    <h2 class="{{c}}__title">{{ include.title }}</h2>

    <div class="{{c}}__goals">
      <h3 class="{{c}}__section-title">{{ include.goals_title }}</h3>
      <div class="{{c}}__col-body">{{ include.goals_html }}</div>
    </div>

    <div class="{{c}}__coursework-section">
      <h3 class="{{c}}__section-title">{{ include.coursework_title }}</h3>
      <div class="{{c}}__coursework">{{ include.coursework_html }}</div>
    </div>

  </div>
</section>
<!-- end career-section -->
